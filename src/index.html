  <script>
    // Apply saved theme + accent before first paint to avoid a flash.
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('yb-theme');
        var accent = localStorage.getItem('yb-accent');
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-accent', accent || 'coral');
      } catch (e) {
        root.setAttribute('data-theme', 'light');
        root.setAttribute('data-accent', 'coral');
      }
    })();
  </script>

</body>
